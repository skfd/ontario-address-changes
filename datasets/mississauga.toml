slug = "mississauga"
provider = "City of Mississauga"
# Found in the ontario-osm-data-sources portal sweep (2026-10-16, registry id ca/on/mississauga/address);
# probed live 2026-10-16: 219,790 points, UPDDT_GIS max 2026-09-25, updated monthly.
# Inside peel-region (264,641 Mississauga rows) but the city's own layer, as brampton is.
data_url = "https://services6.arcgis.com/hM5ymMLbxIyWTjn2/arcgis/rest/services/Address/FeatureServer/0"
access = "arcgis"
format = "geojson"
license_name = "City of Mississauga Terms of Use"
osm_compatible = "yellow-review"
# Terms (PDF item 961c7908...): "world-wide, royalty-free, non-exclusive, revocable licence to
# use, modify, and distribute the Datasets ... for any lawful purpose"; pass the Terms on
# "without introducing any further restrictions".

ignore_fields = [
  # Repeat the geometry.
  "LATITUDE",
  "LONGITUDE",
  # GIS edit stamps: change on any touch.
  "CRTDT_GIS",
  "UPDDT_GIS",
  # Overlay field (overlay-fields policy).
  "WARD",
]

[identity]
# ADDR_ID: 100% populated, unique, range 5..510,138 (not an FID shadow).
key_field = "ADDR_ID"

[fields]                                        # canonical name -> source property
number = "STNO"
street = "STNAME"
unit   = "UNIT_NO"
full   = "FULLNAME"
