slug = "lennox-addington"
provider = "County of Lennox and Addington"
# Catalogued LACivicAddress layer is token-secured; resolved via ArcGIS Online search to the official
# org's open "Public View" (owner LA_County_RB). Region-wide (member munis in BELL_MUNIC).
data_url = "https://services.arcgis.com/YmmKxwNVvLQW5zcm/arcgis/rest/services/L_and_A_County_Civic_Address_Point_%28Public%29/FeatureServer/0"
access = "arcgis"
format = "geojson"
# Licence found 2026-08-20: OGL-Canada-style v2.0, commercial use OK, attribution
# "Contains information licensed under the Open Government Licence - County of Lennox and
# Addington". Item licenseInfo links to
# https://open-data-hub-lennoxaddington.hub.arcgis.com/pages/terms-of-use
license_name = "Open Government Licence - County of Lennox and Addington v2.0"
osm_compatible = "yellow-ogl"

# ADD_LABEL (now the number source below) stays ignored+kept so its prop copy
# remains outside payload_hash, exactly as it hashed before the remap - removing
# it from this list would re-hash every row for nothing. Number, the old source,
# is the suffix-stripped variant ('137' where ADD_LABEL='137A' on 3,733 of
# 26,163 rows, and null on ~580 rows ADD_LABEL fills); it stays in props as an
# ordinary compared field.
ignore_fields = ["ADD_LABEL"]
keep_fields = ["ADD_LABEL"]

[identity]
# No parsed street field (only Number + full ADDRESS) and no stable id; synthesize from the full
# address string + lon/lat (cf. waterloo).
key_field = ""                                 # synthesize
synth_fields = ["full"]

[fields]                                        # source property -> canonical name
# number remapped Number -> ADD_LABEL 2026-08-20: ADD_LABEL carries the house
# suffix Number drops ('137A' vs 137) and is better filled (~100% vs 98%). The
# whole stored history was rewritten to the new mapping the same day
# (tools/remap_canonical_from_prop.py, 3,741 rows) so the remap landed with no
# phantom mass event. Identity synthesizes from `full`, so no row re-keyed.
number = "ADD_LABEL"
full   = "ADDRESS"                              # BELL_MUNIC tracked via the props blob

# Change classes (field values verified against the latest snapshot, 2026-08-20):
# BELL_MUNIC is the member municipality (Addington Highlands, Greater Napanee,
# Loyalist, ...) - a reassignment publishes humanized as a boundary change.
[classes]
boundary = ["BELL_MUNIC"]
