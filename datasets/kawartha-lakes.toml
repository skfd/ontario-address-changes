slug = "kawartha-lakes"
provider = "City of Kawartha Lakes"
data_url = "https://services3.arcgis.com/RQBDTPtsbT0jebs7/arcgis/rest/services/CKL_Address_Point_View/FeatureServer/0"
access = "arcgis"
format = "geojson"
license_name = "Not identified"
osm_compatible = "unknown-review"

[identity]
key_field = "AddressID"                        # persistent address id, 100% populated, has gaps (not a contiguous OBJECTID-style row sequence)
synth_fields = ["number", "street", "unit"]    # fallback only

[fields]                                        # source property -> canonical name
number = "StreetNumber"
street = "StreetNameFull"                        # StreetType/Direction components tracked via the props blob
unit   = "UnitNumber"
full   = "FullAddress"
# StreetDirectionPrefix, StreetNameAlt2 and StreetParity are the fields health.py --drift
# saw the source add on 2026-08-08. Checked 2026-08-10: all three are EMPTY SCHEMA SLOTS —
# 0 of 44,213 rows live apiece, and none has ever been present in props across all 24
# snapshots. Not ignored (cf. oakville's SUITE): the first two are street-name content if
# they ever fill, and StreetParity (odd/even side) would be a class candidate rather than
# an echo. The city's one open item remains the Xlong/Ylat pair — a faithful coordinate
# echo, max 1.32 m at p99, left compared deliberately (see TODO-skills.md §1).

# Change classes (field values verified against the latest snapshot): a
# modification touching only these fields is reported in its humanized section
# (place renames / status changes / boundary reassignments) instead of the
# generic Updated Addresses table.
[classes]
boundary = ["PlaceName"]
