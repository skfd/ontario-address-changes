slug = "peterborough-county"
provider = "County of Peterborough"
# Off-catalogue; found via ArcGIS Online search (official org GIS_PtboCounty). Distinct from the
# City of Peterborough (which is separated and was skipped for an all-rights-reserved licence).
# Region-wide (county townships in MUNICIPALI).
data_url = "https://services3.arcgis.com/08bk1ZSzqef9JX5q/arcgis/rest/services/Public_View_Site_Addresses_/FeatureServer/0"
access = "arcgis"
format = "geojson"
# Licence reviewed 2026-08-20, and it is RESTRICTIVE: item licenseInfo is blank and there is
# no open-data hub, so the county website Terms of Use govern: "The geospatial content... may
# not be put to commercial use, be included in or with any product that is created or
# distributed for a commercial use, or be copied onto any other website without the written
# agreement of or licence by the County" (ptbocounty.ca/terms-of-use-disclaimers). Publishing
# diff reports on a public site is NOT cleared - operator decision needed. TODO.md §3.
license_name = "County website Terms of Use (restrictive - no copying to other websites)"
osm_compatible = "red-review"
# Operator decision 2026-08-20: keep tracking, publish nothing. Landing shows a "licence not
# compatible" badge, no report link; report pages removed at render time. Flip back to true
# if the county grants permission.
publish_reports = false

[identity]
key_field = "SITEADDID"                        # stable site-address id, 100% populated, order-independent (OBJECTID is sequential)
synth_fields = ["number", "street"]            # fallback; no unit field published

[fields]                                        # source property -> canonical name
number = "ADDRNUM"
street = "FULLNAME"                             # PLACENAME/MUNICIPALI/AddressCla tracked via the props blob
full   = "FULLADDR"
# unit: source has none, confirmed 2026-08-10 against the live field list (9 fields, all
# accounted for). 54 of 40,532 ADDRNUM values carry a hyphen; ~31 of those are
# "<number>-<unit>" (1579-1 .. 1579-18, one building) and the rest are ranges. 0.08% —
# noted rather than parsed, cf. brantford where the same pattern covers 5.7%.

# Change classes (field values verified against the latest snapshot): a
# modification touching only these fields is reported in its humanized section
# (place renames / status changes / boundary reassignments) instead of the
# generic Updated Addresses table.
[classes]
place_name = ["PLACENAME"]
boundary = ["MUNICIPALI"]
