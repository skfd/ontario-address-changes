slug = "west-parry-sound"
provider = "West Parry Sound Geography Network"
# District-wide NG911 address layer covering the WPSGN members (9 municipality domain
# values: Seguin, The Archipelago, Parry Sound, McDougall, McKellar, Carling,
# Whitestone, Unorganized, First Nation; the First Nations and local roads boards
# carried separately in firstnation / localroadsboard) - the muskoka shape.
#
# Re-pointed 2026-10-16 from wpsgnPublic/wpsgn_opendata/FeatureServer/0, the layer
# tracked since 2026-08-20. That one answered 500 "Service ... not started" every day
# from 09-24 (the one exception, 10-01, was byte-identical to 08-20), and it had been a
# frozen export all along: never a second distinct snapshot in 56 vault pulls, while
# this layer carries revision_date edits from 2023 through 2026-10. Measured against
# the 08-20 store before switching: 98.1% of identity keys (21,280 of 21,703) survive
# the field map below; the ~420 that don't are a 2023-26 edit backlog (104 Fire Route ->
# named-road renames, 30 renumbers, ~97 points gone, ~130 new) plus ~120 unit re-spellings
# ("Unit 1" -> unitnumber "1", "A & B" -> add_range "A-B"). Neither is a dated change, so
# the store was re-baselined from this layer instead of diffing across the switch (the
# 08-20 store is backed up at C:\Users\kk\ontario-db-backup-2026-10-16-wps\).
# 21,734 rows live 2026-10-16.
data_url = "https://www.wpsgn.ca/s22/rest/services/NG911/NG911/FeatureServer/9112"
access = "arcgis"
format = "geojson"
# Native layer SR is EPSG:26917 (UTM 17N); the fetcher asks for outSR=4326, so this is
# the guard for a future export-CRS switch (pass-through while in lon/lat range).
source_crs = "EPSG:26917"
# Licence: nothing on this service either (copyrightText empty). The network's re3data
# entry (r3d100013016) links the licence PDF, live at
# https://wpsgn.ca/OpenGovernmentLicense%E2%80%93TownshipofTheArchipelago.pdf - v2, based
# on OGL-Canada 2.0 (copy/modify/publish/distribute incl. commercial, attribution
# required). Oddity: the licence is issued in the name of one member (Township of The
# Archipelago) while the layer covers all members; re3data lists it as the licence for
# the whole WPSGN repository. Worth confirming scope with info@wpsgn.ca.
license_name = "Open Government License - Township of The Archipelago (v2, based on OGL-Canada 2.0)"
osm_compatible = "yellow-ogl"

# creation_date / revision_date are NENA's record-maintenance timestamps (epoch ms;
# 74% / 32% populated) - the editor-tracking class EDIT_METADATA_FIELDS strips
# globally under other spellings. No address content; ignored from day one, as the
# old layer's CreationDate/ModificationDate were. The rest (LinkObjId, rotation,
# pointtype, provider_type, ...) stay tracked until history shows churn.
ignore_fields = ["creation_date", "revision_date"]

[identity]
# globalid since 2026-10-23 (synthesized from address + point before). Measured across
# the four distinct pulls of this layer (10-16, 10-19, 10-20, 10-21): 100% populated and
# unique on every one, and all 21,734 ids of 10-16 kept the same value through 10-21 - no
# regeneration on republish (the brant worry). It carried both renumbers under one id:
# 146 -> 146A Christie Bay Road (10-19) and 44 -> 30 Emily Street (10-20), each with an
# extra_data note ("orig set to 44, chgnd to 30 ..."); 10-21 added one id (1 Nest
# Subdivision Temp). Under the synth key each renumber was a retire + new address; under
# globalid it is the modification it is. The store was re-baselined by replaying its
# pulls under this key (backup: C:\Users\kk\ontario-db-backup-2026-10-23-rekey\west-parry-sound\);
# recanonicalize could not re-key it, since is_volatile strips globalid from stored props
# (the key itself is read from the raw feature, as newmarket's GLOBALID is).
# Not usable: add_pt_key and civicid are empty on every row. parcelid is the assessment
# roll (the old Rollnumber: 1:many, up to 47 rows on 490301001375000, 105 "none").
# OBJECTID is sequential. extra_data stays tracked (operator call, 2026-10-23): it is
# the editors' change note and carries real data ("Water Access", "Now Road Access").
key_field = "globalid"
synth_fields = ["number", "street", "unit"]    # fallback only if a row ever lacks globalid

[fields]                                        # source property -> canonical name
number = "add_num"                              # carries the suffix ("298A"); add_num_pre/add_num_suf are empty
street = "name_body"                            # the whole street name ("Peninsula Shores Road East");
                                                # every NENA prefix/suffix/direction/type column is empty
unit   = "unitnumber"                           # 96 of 21,734 rows, bare ("1"). Oddities: unitnumsuffix holds
                                                # the word "Unit"/"Units", and multi-unit ranges live only in
                                                # add_range ("A-B") and full_add ("... Units A-B")
full   = "full_add"                             # includes the unit ("58 Winnifred Avenue Unit 1")

# Change classes (domains read from the live layer 2026-10-16): a modification
# touching only these fields is reported in its humanized section instead of the
# generic Updated Addresses table. pointtype is NOT a status - its domain is the
# placement method (Building Centroid 18,574, Unknown 1,736, Other 1,049, entrances,
# Parcel Centroid) - so a re-placement shows up as a location change plus pointtype.
[classes]
boundary = ["municipality", "firstnation", "localroadsboard"]
status = ["retired_date"]                       # empty on every row today
