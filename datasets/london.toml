slug = "london"
provider = "City of London"
# Catalogued maps.london.ca/arcgisa path is dead (404); resolved via the ArcGIS Hub v3 API
# (opendata.london.ca item 24b16712...) to the live /server/ path.
data_url = "https://maps.london.ca/server/rest/services/OpenData/OpenData_Community/MapServer/0"
access = "arcgis"
format = "geojson"
# Terms read 2026-08-20 ("Terms of Use - City of London Open Data", the PDF the DCAT feed
# binds to the Addresses dataset). (1) Automated periodic retrieval: permitted by silence -
# no clause restricts automated or repeated access; grant is "world-wide, royalty-free,
# non-exclusive license to use, modify, and distribute the data sets in all current and future
# media and formats for any lawful purpose"; no continuity promise, revocable at discretion.
# (2) Publishing derived diff reports: YES, with pass-through - distribution "whether in
# original or modified form" requires including a copy of or URL to the terms and binding
# recipients without further restrictions. Credit optional; no-endorsement/no-logo clauses.
# Operator action if desired: add the terms URL to london's published pages. OSM compatibility
# (ODbL vs pass-through) still unresolved - stays red.
license_name = "Terms of Use - City of London Open Data"
osm_compatible = "red-review"

# Composites/components of the mapped fields, all verified by sampling 2026-08-20
# ('58 Langarth St E': StreetName='Langarth', StreetType='St', StreetDirection='E',
# FullNumber='58', IntegerMunicipalNumber=58, UnitFullAddress='58 Langarth St E').
# Observed riding as echoes on the July unit edits; every future rename/renumber
# would drag them in the same way (toronto LINEAR_NAME / LO_NUM precedent).
# MunicipalNumberQualifier stays compared: it is the house-suffix source, content
# the mapped MunicipalNumber does not carry.
ignore_fields = [
  "StreetName", "StreetType", "StreetDirection",
  "FullStreetName_ID",                 # street join id, renumbers with the street table
  "FullNumber", "IntegerMunicipalNumber", "UnitFullAddress",
]

[identity]
key_field = "GIS_ID"                           # stable address id, 100% populated, order-independent (OBJECTID is sequential)
synth_fields = ["number", "street", "unit"]    # fallback only

[fields]                                        # source property -> canonical name
number = "MunicipalNumber"
street = "FullStreetName"                       # StreetName/Type/Direction components tracked via the props blob
unit   = "UnitNumber"
full   = "FullAddress"

# Change classes (field values verified against the latest snapshot): a
# modification touching only these fields is reported in its humanized section
# (place renames / status changes / boundary reassignments) instead of the
# generic Updated Addresses table.
[classes]
status = ["Status"]
boundary = ["ElectionWard"]
