slug = "brampton"
provider = "City of Brampton"
data_url = "https://maps1.brampton.ca/arcgis/rest/services/COB/OpenData_Address_Points/MapServer/14"
access = "arcgis"
format = "geojson"
license_name = "Creative Commons Attribution 4.0 (CC BY 4.0)"
osm_compatible = "orange-ccby-waiver"

# Sub-parcel cartographic maintenance: near-weekly sweeps nudge 50-600 points
# 1-15 m, rotating through different streets each time (ten flags 2026-06-17..
# 08-19). No address moved; drop location-only changes under 25 m.
location_min_move_m = 25

# Planning/permit metadata joined onto address points; it churns on its own
# schedule and oscillates (C_OF_A flipped A-2022-0345<->0346 on 292 rows in each
# direction twice over July-August 2026). None of it says anything about the
# address itself (flags 2026-06-20..08-16). REG_PLAN_NUMBER is the registered
# sibling of DRAFT_PLAN_NUMBER: a subdivision's 61 points got the draft number
# on 2026-09-02 and the registered one on 09-09 (flags 2026-09-02, 09-09).
ignore_fields = [
  "C_OF_A", "CITY_FILE", "DRAFT_PLAN_NUMBER", "REG_PLAN_NUMBER", "CONDO_PLAN_NUMBER",
  "PERMIT_ISSUEDATE", "PERMIT_NO", "PERMIT_TYPE", "SUB_TYPE", "WORK_TYPE",
  "OCCUPANCY_DATE",
]

[identity]
key_field = "ADDRESS_ID"                       # stable municipal address id, 100% populated (GIS_ID/OBJECTID are sequential)
# ADDRESS_ID names the address, not the point: an address can carry a PRIMARY point plus
# SECONDARY / FRONTDOOR ones under the same id (10-23 pull: PRIMARY 249,290, SECONDARY
# 3,202, FRONTDOOR 1,299; 3,149 ids shared). Store the PRIMARY one - under the old
# file-order dedupe 1,206 of those ids sat at a non-primary point (2026-10-24).
prefer = {field = "ADDRESS_TYPE", value = "PRIMARY"}
synth_fields = ["number", "street", "unit"]    # fallback only if a row ever lacks ADDRESS_ID

[fields]                                        # source property -> canonical name
number = "CIVIC_NUMBER"
street = "STREET_NAME"                          # STREET_TYPE/STREET_DIRECTION tracked via the props blob
unit   = "UNIT_NO"
full   = "FULL_ADDRESS"

# Change classes (field values verified against the latest snapshot): a
# modification touching only these fields is reported in its humanized section
# (place renames / status changes / boundary reassignments) instead of the
# generic Updated Addresses table.
[classes]
boundary = ["WARD", "CITY", "TOWNSHIP"]
