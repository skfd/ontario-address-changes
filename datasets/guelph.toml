slug = "guelph"
provider = "City of Guelph"
# The catalogued services5.arcgis.com/k3dd78JyG9GFoZHG Addresses layer is gone, and ArcGIS Online
# search only surfaces untrusted *_exchange copies; the OFFICIAL source is the city's self-hosted
# open-data server (owner GuelphGIS_cityofguelph). OpenData1 layer 0 = Addresses.
data_url = "https://gismaps.guelph.ca/hosting/rest/services/OpenData/OpenData1/FeatureServer/0"
access = "arcgis"
format = "geojson"
license_name = "Open Government Licence - City of Guelph"
osm_compatible = "green-lwg"

# Street blocks translated together 5-9 m on 2026-06-24/25 (Emma St 95-113 all
# moved the same direction); segment-realignment maintenance, not moves.
location_min_move_m = 25

# Source props whose changes are noise, established by tallying every field-level
# change across the snapshot history. Without these, three days were 100% fake mass
# events and the Location Adjustments category could never fire (a coordinate move
# always dragged LAT/LONG/UTM_X/UTM_Y along, so the row read as a generic update).
ignore_fields = [
  # Gone from the source; each removal faked a 53k-row mass event.
  "STATION_RESPONSE_ORDER",   # present in the 2026-07-24 pull only
  "AMAID",                    # dropped by the source 2026-08-04
  # Duplicates of the point geometry, already tracked as coordinates.
  "LAT", "LONG", "UTM_X", "UTM_Y",
  # Derived from the mapped fields: ADDLEG = legacy full address,
  # LABEL = number[+unit] map label.
  "ADDLEG", "LABEL",
  # Property-registry join keys, rekeyed in batches upstream.
  "PIN", "GPID", "ROLL_NO",
]

# Ignored for change detection (above) but still written to props: the parcel /
# assessment links are the only join from an address to the land registry and the
# tax roll, and exist nowhere else once ingested.
keep_fields = ["PIN", "GPID", "ROLL_NO"]

[identity]
key_field = "ADDID"                            # stable address id, 100% populated, range 2000-57588 over 53,889 rows (effectively unique; OBJECTID is sequential)
synth_fields = ["number", "street", "unit"]    # fallback only

[fields]                                        # source property -> canonical name
number = "STREETNO"
street = "FULLNAME"                             # STREETNAME/STSUF/STDIR components tracked via the props blob
unit   = "UNIT_NO"
full   = "ADDRESS"

# Change classes (field values verified against the latest snapshot): a
# modification touching only these fields is reported in its humanized section
# (place renames / status changes / boundary reassignments) instead of the
# generic Updated Addresses table.
[classes]
status = ["STATUS"]
boundary = ["PLACE", "WARD"]
