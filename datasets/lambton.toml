slug = "lambton"
provider = "County of Lambton"
data_url = "https://www.lambtongis.ca/arcgis_adaptor/rest/services/OpenData/AddressPoints/MapServer/0"
access = "arcgis"
format = "geojson"
license_name = "Open Government Licence - County of Lambton"
osm_compatible = "green-ogl"

[identity]
key_field = ""                          # only a sequential OBJECTID exists; synthesize
synth_fields = ["number", "street"]     # no unit field is published

[fields]                                # source property -> canonical name
number = "STNUM"
street = "STNAME"                        # STTYPE/STDIR (and abbreviations) tracked via the props blob
full   = "ADDRESS"
# unit: source has none, confirmed 2026-08-10 against the live field list (11 fields, all
# accounted for). 7 of 56,903 STNUM values embed one as "<number>-<unit>" (1140-1 .. 1140-4)
# — the reverse order from brantford's, and at 0.01% not worth parsing for.

# Change classes (field values verified against the latest snapshot): a
# modification touching only these fields is reported in its humanized section
# (place renames / status changes / boundary reassignments) instead of the
# generic Updated Addresses table.
[classes]
boundary = ["MUNICIPALITY", "CITY"]
