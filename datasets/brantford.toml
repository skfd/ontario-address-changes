slug = "brantford"
provider = "City of Brantford"
# BETTER-LAYER FINDING (onboarding probe, 2026-08-17): the same org publishes
#   SiteAddress_pub/FeatureServer/0  (38,603 pts, verified 2026-08-17)
# which solves BOTH of this dataset's open problems at the source:
#   - ADDPTKEYNUM is a stable key (identity here is synthetic);
#   - STNUMPRE/STREETNUMINT decompose the "<unit>-<number>" fusion this
#     file's unit note documents (2,198 rows with STNUMPRE ≈ the 2,213
#     fused rows here), so the deferred unit-parse question disappears.
# Also adds MUNINAME, STDIRSUFF, PROVINCE. Re-pointing re-keys the history
# (a tracker decision, exactly like dufferin's). The brantford checkout is
# PARKED until this is resolved (engine onboarding-queue.md).
data_url = "https://services.arcgis.com/aji2lCmjXt0KpGzI/arcgis/rest/services/OP_Site_Addresses2/FeatureServer/0"
access = "arcgis"
format = "geojson"
license_name = "Open Government Licence - Brantford"
osm_compatible = "yellow-ogl"

[identity]
# No stable source id (OBJECTID and OBJECTID_1 are both sequential); no unit field published.
key_field = ""                                 # synthesize from address + rounded lon/lat
synth_fields = ["number", "street"]            # no unit field in this layer (cf. lambton)

[fields]                                        # source property -> canonical name
number = "STREETNUM"                            # the COMBINED form ("197E"); STREETNUMIN is the bare integer
street = "STREETNAME"                           # STREETTYPE/STNUMSUFF tracked via the props blob
full   = "FULLADDRESS"
# unit: no unit COLUMN exists (verified 2026-08-10 against the live layer — 9 fields
# total). But units are published, embedded in STREETNUM/FULLADDRESS as "<unit>-<number>"
# on 2,213 of 38,981 rows (5.7%): 177 distinct left parts share the right part "77", 138
# share "21", 116 share "20", which no house-number RANGE can do. The other 436 hyphenated
# rows read left>=right and are ranges proper. So the choice here is waterloo's, not
# dufferin's — parse the unit out of STREETNUM, or accept unit-less display — and it is
# recorded in TODO.md §1 rather than decided here, because adding `unit` to synth_fields
# would re-key all 38,981 rows.
