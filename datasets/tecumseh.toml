slug = "tecumseh"
provider = "Town of Tecumseh"
# Found in the ontario-osm-data-sources portal sweep (2026-10-16, registry id ca/on/essex-county/town-of-tecumseh-address-points);
# probed live 2026-10-16: 9,860 points; item modified 2026-08-31. The first Essex
# County member with address points (skipped.toml said Essex had none).
data_url = "https://gisweb.tecumseh.ca/arcgis/rest/services/OpenDataMaps/OpenDataMAP_InfraZonePropBound_Layers/MapServer/33"
access = "arcgis"
format = "geojson"
# Native layer SR; the geojson export arrives in WGS84, so this guards a future export-CRS switch.
source_crs = "EPSG:26917"
license_name = "Open Government Licence - The Corporation of the County of Essex"
osm_compatible = "yellow-review"
# Read 2026-10-16: the only grant in the chain is the County of Essex OGL v1.0, hub-wide
# (https://gisweb.countyofessex.ca/OpenData/County%20of%20Essex%20-%20Open%20Government%20Licence.pdf);
# the county hub's home page names Tecumseh among the municipalities it covers ("You may use and
# republish the data as you wish"). The item (a0c6e857..., in the county's AGOL org, authored by
# a town account) and both DCAT feeds carry only "(c) Copyright Town of Tecumseh" + a disclaimer -
# the same template the county's own OGL datasets use, so no grant and no restriction. Gap: OGL
# section 12 names the County as Information Provider and 6(c) exempts third-party rights it may not
# license; a one-line confirmation from Tecumseh GIS closes it. Attribution: "Contains information
# licensed under the Open Government Licence - County of Essex" (+ "(c) Town of Tecumseh").

ignore_fields = [
  # Repeat the geometry.
  "X",
  "Y",
]

[identity]
# GIS_ID is populated but polluted with sentinels ('T_0000', 'Lakeshore'): synthesize. No unit
# field; 31 rows carry units inside AddressComplete. 56 rows are CITY=LAKESHORE.
key_field = ""
synth_fields = ["number", "street"]

[fields]                                        # canonical name -> source property
number = "CIVICNO"
street = "STREETNAME"
full   = "AddressComplete"

[classes]
status = ["TYPE"]
