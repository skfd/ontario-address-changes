slug = "niagara-falls"
provider = "City of Niagara Falls"
data_url = "https://services1.arcgis.com/WxiLK82TWf8W3O3f/arcgis/rest/services/OpenData_Address_Points/FeatureServer/43"
access = "arcgis"
format = "geojson"
license_name = "Open Government Licence - Niagara Region"
osm_compatible = "green-lwg"

# Street-block nudges of 1-5 m (Bentley St rows moved together, 2026-06-10);
# sub-parcel cartographic maintenance, not moves.
location_min_move_m = 25

# Xcoord/Ycoord duplicate the point geometry (tracked as coordinates already);
# StreetNo duplicates the mapped number field (Full_StreetNo = StreetNo + suffix).
ignore_fields = ["Xcoord", "Ycoord", "StreetNo"]

[identity]
key_field = "GSmartID"            # stable municipal point id, 100% populated and unique (OBJECTID is sequential, untrusted)
synth_fields = ["number", "street", "unit"]   # fallback only if a row ever lacks GSmartID

[fields]                          # source property -> canonical name; unmapped props kept in the tracked blob
number = "Full_StreetNo"
street = "StreetName"             # StreetType/StreetDir are separate source fields, tracked via the props blob
unit   = "Unit"
# No combined full-address field is published; `full` stays empty. Re-confirmed 2026-08-10
# against the live field list (15 fields, all accounted for).
#
# StreetNoUpper is the field health.py --drift saw the source add on 2026-08-08. Checked
# 2026-08-10: an EMPTY SCHEMA SLOT — 0 of 207,958 rows live, never present in props across
# all 20 snapshots. Deliberately NOT added to ignore_fields alongside its neighbour
# StreetNo, for the reason oakville's SUITE established: the pre-emptive ignore is right
# for a coordinate echo and wrong for a column that would carry address content. StreetNo
# is ignored because it duplicates the mapped number; StreetNoUpper, if the city ever
# fills it, is the top of a house-number range, which is content we would want to see.

# Change classes (field values verified against the latest snapshot): a
# modification touching only these fields is reported in its humanized section
# (place renames / status changes / boundary reassignments) instead of the
# generic Updated Addresses table.
[classes]
status = ["LifeCycleStatus"]
boundary = ["Municipality"]
