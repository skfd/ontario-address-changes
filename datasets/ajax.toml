slug = "ajax"
provider = "Town of Ajax"
# Found in the ontario-osm-data-sources portal sweep (2026-10-16, registry id ca/on/ajax/civic-addresses-ajax-only);
# probed live 2026-10-16: 38,433 points, LAST_EDITED_DATE max 2026-10-16. Inside durham (37,778 Ajax rows) but the
# town's own layer, edited daily; the region roll-up is not a reason to skip it.
data_url = "https://ajaxmaps.ajax.ca/gisernie/rest/services/Public/Ajax_Open_Data/MapServer/10"
access = "arcgis"
format = "geojson"
# Native layer SR; the geojson export arrives in WGS84, so this guards a future export-CRS switch.
source_crs = "EPSG:26917"
license_name = "Town of Ajax - Open Data Licence v.1.0"
osm_compatible = "yellow-review"
# Read 2026-10-16: a 3-page OGL-Ontario clone (worldwide, royalty-free; copy, publish, adapt,
# commercial use; credit *optional*: "Contains public sector Information made available under
# The Corporation of the Town of Ajax's Open Data Licence"), PDF item 22e2d8e2...:
# https://townofajax.maps.arcgis.com/sharing/rest/content/items/22e2d8e248724d7cb0310dc2db675abd/data
# It reaches this layer only site-wide: the hub home page (maps-townofajax.opendata.arcgis.com)
# says "By using the Town of Ajax Open Data site you agree to the following licence"; the layer's
# item (e48315e9...) has licenseInfo null and the DCAT row has license "". The site item's own
# licenseInfo field says "CC-BY-SA" (a stale default, not the visible text). Promote to yellow-ogl
# once the town confirms the licence covers this item, the prince-edward-county shape.

ignore_fields = [
  # Repeat the geometry.
  "X_COORD",
  "Y_COORD",
  # Edit stamps: change on any touch.
  "LAST_EDITED_USER",
  "LAST_EDITED_DATE",
]

[identity]
# Synthesized since 2026-10-23. FACILITYID (= ID_CRISYS) was the key from 10-16: 100%
# populated, 38,401 distinct of 38,433, not an OBJECTID shadow - but not unique. 24
# FACILITYIDs are shared by 56 rows (2 to 4 each), and the importer's dedupe keeps the
# first row per key, so 32 real addresses were never stored: key 46307 kept "26A DORIC ST"
# and dropped "26 DORIC ST"; key 431 kept "282 MONARCH AV" and dropped 292 and 272; key
# 3121 holds 2948/2952/2956/2960 EBONY ST. Mostly a suffix sibling (165/165A WHITEFOOT
# CR, 16/16A FLETCHER AV) or a neighbour. Measured on the 10-16 pull (every pull since is
# byte-identical): number + street + unit + rounded point gives 38,432 distinct keys on
# 38,432 rows with geometry, 0 collisions (full alone or number + street also gave 0;
# the house basis was taken). The point is load-bearing: 82 number/street/unit groups
# (224 rows) repeat the same text and are told apart only by location, and with one
# distinct pull so far there is no measure of coordinate jitter on republish - watch
# for retire + new pairs at the same address. The store was re-baselined by replaying
# its pulls under this key (backup: C:\Users\kk\ontario-db-backup-2026-10-23-rekey\ajax\).
# Not used instead: OBJECTID, the layer's row id (distinct, 1..58,037 in file order; the
# pipeline strips it as volatile). One row has no geometry (85 OSWELL DRIVE).
key_field = ""                                 # synthesize from address + rounded lon/lat
synth_fields = ["number", "street", "unit"]

[fields]                                        # canonical name -> source property
number = "ADD__"
street = "STREET_SUFFIX"
unit   = "UNITS"
full   = "FULL_ADDRESS"
