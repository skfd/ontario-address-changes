slug = "dufferin"
provider = "County of Dufferin"
# WRONG-LAYER FINDING (onboarding probe, 2026-08-16): this dataset tracks the
# county's ENTRANCES layer — driveway entrance points. 3,270 of 27,075 rows
# (12%) have no housenumber (unnumbered field/laneway entrances), 444 civic
# keys repeat (multi-entrance parcels), and FULLADDY is misaligned with
# STREETNUM on ~466 rows (off-by-one-row generation, incl. a digit
# transposition). The same org publishes a proper open-data address layer:
#   Address_Points_DufferinCounty_Open_Data/FeatureServer/0
#   (28,297 points; CIVIC_NO, STREETNAME typed, ST_TYPE, TOWN = all 8
#   municipalities, UNIT, CIVICFULL, ADDYALIAS — verified 2026-08-16)
# Re-pointing means a new identity mapping and a fresh snapshot history, so
# it is a tracker decision, not a city-config workaround. The dufferin
# checkout is PARKED until this is resolved (engine onboarding-queue.md).
# 2026-10-12, re-evaluated with the licence diff (ontario-osm-data-sources
# licences/dufferin/verdict.md): NOT re-pointed. The licence argument runs the
# other way here - THIS layer's item (0a7cdf8b0e74434c82eced47538bf4f1) links
# the licence PDF directly, while Address_Points (item 2fca5d07a8bb432b8addb7d2131e9996)
# has an empty licenseInfo and is covered only by the open-data page's portal-wide
# notice. So what is left is the data-quality re-point, still a user decision, and
# the address layer has faults of its own (pulled 2026-10-11, 28,305 rows): 2,624
# (9.3%) have no CIVIC_NO; FULLADDY != CIVIC_NO + STREETNAME on ~3,800, some
# holding editor notes ("2026 APRIL 10 ADDED FROM ORANGEVILLE"); UNIT is set on
# 83 rows, many of them legal descriptions or street names; no stable id, so a
# synthesized key (5 collisions on number+street+unit+geometry).
# RE-POINTED 2026-10-16 (owner's call) from Dufferin_County_Entrances (27,075 driveway
# entrance points, last edited 2017-08-02: one distinct snapshot in four months) to the
# county's live address layer below (28,305 points, lastEditDate 2026-10-08). The old store
# held only its baseline, so it is rebuilt rather than diffed (backup at
# ontario-db-backup-2026-10-16-dufferin); the vault keeps every Entrances pull. The licence
# argument above stands: this item's licenseInfo is empty and it is covered by the open-data
# page's portal-wide notice. Known faults: 2,627 rows have no civic number (street-only points
# such as "RIVER ROAD"), FULLADDY disagrees with CIVIC_NO + STREETNAME on ~3,800 rows.
data_url = "https://services5.arcgis.com/C0BEdgagVaXzcw0W/arcgis/rest/services/Address_Points_DufferinCounty_Open_Data/FeatureServer/0"
access = "arcgis"
format = "geojson"
license_name = "Open Government Licence - County of Dufferin"
# Self-listed on wiki Contributors 2026-10-12 under the OSMF self-service procedure (diff vs Ottawa 2.0:
# ontario-osm-data-sources/licences/dufferin/verdict.md); LWG told by email. Not yet on the OSMF list.
osm_compatible = "green-self"

[identity]
# No key column besides OBJECTID: synthesize (5 collisions on number+street+unit+geometry).
key_field = ""
synth_fields = ["number", "street", "unit"]

[fields]                                        # canonical name -> source property
number = "CIVIC_NO"
street = "STREETNAME"
unit   = "UNIT"
full   = "FULLADDY"

[classes]
boundary = ["TOWN"]
