slug = "muskoka"
provider = "District Municipality of Muskoka"
# Catalogued map.muskoka.on.ca shapefile zip is 404; resolved via ArcGIS Online search to the official
# org (owner dm.admin) live Addressing service. Region-wide (all Muskoka towns in Municipality field).
data_url = "https://utility.arcgis.com/usrsvcs/servers/21293eed759e41848ccb92619633de03/rest/services/Addressing/Addressing_Service_Public/FeatureServer/0"
access = "arcgis"
format = "geojson"
# Licence reviewed 2026-08-20: custom terms with NO reuse grant. The terms page
# (map.muskoka.on.ca/pages/terms-of-use) is a King's Printer copyright notice + disclaimer:
# "Includes material (c) 2026 of the King's Printer for Ontario. All rights reserved... Any
# party relying on this information does so at their own risk." Road data is ORN "used under
# licence from the Government of Ontario". Not open; diff-report publishing not cleared.
license_name = "Custom terms - no reuse grant (King's Printer copyright)"
osm_compatible = "red-review"

# The service's republish wobble moves points up to ~1.4 m (one 5-dp step; see
# the identity comment below - the same jitter that forced use_geometry off, and
# what the 2026-07-01 outage-recovery day rewrote 28,540 rows with). Real
# re-surveys here travel 5-110 m and still publish.
location_min_move_m = 2

[identity]
# PropertyNum is an assessment roll number (1:many with addresses), so it can't be the
# key on its own -- but it is the right disambiguator here, because geometry can't be.
# This service's coordinates jitter up to 1.36 m between republishes, which crosses the
# 5 dp (~1.1 m) rounding in normalize._identity: the 2026-06-28..07-01 republish alone
# minted new keys for 28,250 of 65,279 addresses, leaving 157,666 keys for a 66k-row
# city. Address + PropertyNum is stable across that boundary (0 churn) at the cost of
# 279 same-address-same-roll rows collapsing onto shared keys.
key_field = ""                                 # synthesize from address + roll number
synth_fields = ["number", "street", "unit"]
synth_props = ["PropertyNum"]
use_geometry = false

[fields]                                        # source property -> canonical name
number = "StreetNumber"
street = "StreetName"                           # StreetQual/StreetAlias/Municipality tracked via the props blob
unit   = "StreetUnit"
full   = "Location"

# Change classes (field values verified against the latest snapshot): a
# modification touching only these fields is reported in its humanized section
# (place renames / status changes / boundary reassignments) instead of the
# generic Updated Addresses table.
[classes]
boundary = ["Municipality"]
