slug = "leamington"
provider = "Municipality of Leamington"
# Found 2026-10-22 by the hub-blind-spot check: the layer sits in the County of Essex AGOL org
# (owner dsimpson_leamington, item 5628a315631e462ea3fcee331f8cb477 "911 Address pts") but is
# not shared to the county Hub, which is all the 2026-10-16 sweep read. Probed live 2026-10-23:
# 11,424 points against 9,701 NAR locations. Item created 2025-06-09; all three editingInfo
# stamps equal the item's modified date (2025-07-08), so this is one hosted upload with no
# edits since - it may be a static copy; check that it moves before relying on its cadence
# (the prince-edward-county caveat). Companion Parcels_CIVIC/FeatureServer/0 (11,685 parcels,
# edited 2026-08-14) is parcels, not addresses. Layer 4 of this service,
# SDE_PointPelee_AddressPts, is 21 Point Pelee park facilities (Name + a bare civic number, no
# street) - not tracked.
data_url = "https://services6.arcgis.com/baycHE2iKJaT7Upn/arcgis/rest/services/SDEAddressPts/FeatureServer/3"
access = "arcgis"
format = "geojson"
# Native layer SR; the geojson export arrives in WGS84, so this guards a future export-CRS switch
# (the amherstburg/tecumseh precedent).
source_crs = "EPSG:26917"
# Read 2026-10-23: item licenseInfo, accessInformation and the layer copyrightText are all
# empty. The County of Essex OGL that carries tecumseh is granted through the county Hub, and
# this item is not on the Hub, so it does not obviously reach it. Ask Leamington (or County of
# Essex) GIS whether the County OGL covers it.
license_name = "None published (read 2026-10-23)"
osm_compatible = "unknown-review"
publish_reports = false

# Units ride inside Addressche between the number and the street (no unit column):
# normalize.unit_from_full takes them out as published, anchored on AddressNum and
# StreetName. See the [fields] note.
unit_from_full = true

[identity]
# GlobalID: unique on all 11,424 rows. OBJECTID is gappy (1..45,333 for 11,424 rows), so the
# hosted copy carries the SDE source's ids rather than renumbering on upload - the
# elgin/perth-county reading. If a re-share ever mints fresh GlobalIDs (a homogeneous
# retire-all/add-all), the fallback is synth_fields = ["full"]: 0 collisions with 5dp
# geometry on 2026-10-23, against 114 for number+street, which collapses the units below.
key_field = "GlobalID"

[fields]                                        # canonical name -> source property
number = "AddressNum"                           # keeps suffixes ("10B", 401 rows); 9 blank
street = "StreetName"                           # long form ("TALBOT ROAD EAST"); 49 blank
full   = "Addressche"                           # "<number> [<unit>] <street>"; 8 blank
# MatchStName / MatchAddress are the geocoder-abbreviated forms ("TALBOT RD E") and ride in the
# props blob. No ignore_fields day one: no history yet.
# unit: no unit COLUMN; unit_from_full above derives it (2026-10-23, measured on 11,423
# stored rows). Addressche is "<AddressNum> <StreetName>" on 10,804 and
# "<AddressNum> <unit> <StreetName>" on 488, every one designator-led: UNIT 262, APT 88,
# SUITE 59, FLR 45, BLDG 3 (each + one token: "24 UNIT 300 SEACLIFF DRIVE EAST",
# "1217 FLR 01 MERSEA RD 2" - street "MERSEA RD 2", so the 2 is the street's) and the
# positional UPPER 11, LOWER 9, REAR 7, FRONT 4 standing alone ("437 LOWER OAK STREET
# EAST"; "4 LOWER ROAD" stays whole - LOWER ROAD is the StreetName). 69 more carry it
# AFTER the street, also taken (2026-10-24, same flag, same anchoring; a pair designator
# only): 7 CHERRY LANE UNIT 1..49 x35, 109 ROBSON ROAD UNIT 101..904 x33, "3 IROQUOIS
# ROAD  BLD 2". Left unparsed (unit stays blank): two doubled ("17 APT B CLARK STREET
# EAST APT B") and 11 number/street mismatches ("275 ERIE STREET SOUTH" under 269 x6,
# "717 HIGHWAY 77" under MERSEA RD 7). Shared number+street(+unit) groups: 141 (710
# rows) -> 9 (96) -> 7 (31). GlobalID keys, so display only - no re-key; [fields] is
# unchanged, so the vault's sketch basis is too.

# [classes] deferred: no transitions observed yet, and no status/boundary column exists.
