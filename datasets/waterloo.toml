slug = "waterloo"
provider = "City of Waterloo"
# Re-pointed 2026-10-16 from the ArcGIS Open Data shapefile export of item
# fb1ce9625c634b2dbe1d2be36d419711, a stale cache: one content hash across every pull since
# 2026-06-10 (55,541 rows), while the live layer behind the same item had 55,847 rows and
# dataLastEditDate 2026-10-07. Same fields, same ADDRESS_ID. The old store held only its
# baseline, so the switch is a fresh baseline (backup at ontario-db-backup-2026-10-16-waterloo).
data_url = "https://services.arcgis.com/ZpeBVw5o1kjit7LT/arcgis/rest/services/Addresses/FeatureServer/0"
access = "arcgis"
format = "geojson"
license_name = "Open Government Licence – City of Waterloo"
osm_compatible = "green-lwg"

# LATITUDE/LONGITUDE are a FAITHFUL echo of the geometry (audit.py --coords, 2026-08-10):
# max deviation 0.69 m over 55,541 rows, p99 0.64 m, nothing past 11 m — the cleanest of
# the eleven duplicates in the 42. Finer than the 5 dp everything is compared at, so it
# can only move on jitter below that resolution. Ignored for tidiness, not urgency.
ignore_fields = ["LATITUDE", "LONGITUDE"]

[identity]
key_field = "ADDRESS_ID"       # stable address id (OBJECTID_1 is sequential, untrusted)
synth_fields = ["full"]

[fields]
street = "STREET_NM"
full   = "CIVIC_ADDR"

# Change classes (field values verified against the latest snapshot): a
# modification touching only these fields is reported in its humanized section
# (place renames / status changes / boundary reassignments) instead of the
# generic Updated Addresses table.
[classes]
boundary = ["WARD"]
