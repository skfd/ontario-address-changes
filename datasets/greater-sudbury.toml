slug = "greater-sudbury"
provider = "City of Greater Sudbury"
# Catalogued self-hosted gis.greatersudbury.ca REST root was dead (404); resolved via ArcGIS Online
# search to the official org (owner Greater.Sudbury, services.arcgis.com/q3mIlR87lZlZsds3). Layer 2.
data_url = "https://services.arcgis.com/q3mIlR87lZlZsds3/arcgis/rest/services/Address_and_Building_Roofline/FeatureServer/2"
access = "arcgis"
format = "geojson"
license_name = "Open Data Licence - City of Greater Sudbury"
osm_compatible = "green-lwg"

ignore_fields = [
  # Components of the mapped FULLSTREETNAME ('130 Copper Street' carries
  # BASESTREETNAME='Copper', STREETTYPE='Street'): 44 rides, 0 solo changes across
  # 63 snapshots - every street edit dragged both in as echo rows (toronto
  # LINEAR_NAME precedent).
  "BASESTREETNAME", "STREETTYPE",
  # Internal link from a secondary address to its assigned primary; rewritten
  # wholesale whenever a record is re-parented (44 rides, 0 solo). Kept in props
  # as the only primary-secondary linkage once ingested.
  "ASSIGNEDADDRESSID",
]
keep_fields = ["ASSIGNEDADDRESSID"]

# Sub-parcel cartographic nudges. Measured across all location-only moves since
# 2026-06 (excluding three points that bounce 9-137 m daily, see below): 201 of
# 225 travel under 10 m, 8 sit in the 10-25 m band, 16 are 25 m+. The 2026-09-25
# sweep (57 rows, McNeill/Bloor/White/Patterson cluster) was median 3.4 m, p90
# 6.7 m, 54 of 57 under 10 m. 10 rather than the 25 used elsewhere so the 12-25 m
# re-placements this city does a few of each week keep publishing.
# Not a fix for ADDRESSID 107023 / 107038 / 58596, which oscillate between a
# handful of positions 9-137 m apart on most pulls (184 of 409 historical moves)
# and leak onto the site as daily Location Adjustments; that wants city-tune.
location_min_move_m = 10

[identity]
key_field = "ADDRESSID"                        # stable address id, 100% populated, order-independent (OBJECTID is sequential)
synth_fields = ["number", "street", "unit"]    # fallback only

[fields]                                        # source property -> canonical name
number = "ADDRESSNUMBER"
street = "FULLSTREETNAME"                        # BASESTREETNAME/STREETTYPE/COMMUNITY tracked via the props blob
unit   = "UNIT_OR_AMENITY"
full   = "FULLADDRESSTEXT"
# STREETPREFIX is the field health.py --drift saw the source add on 2026-08-08. Checked
# 2026-08-10: an EMPTY SCHEMA SLOT — 0 of 70,100 rows live, never present in props across
# all 58 snapshots. Not ignored (cf. oakville's SUITE): a filled street prefix is part of
# the street name, i.e. content, not an echo. Three sibling columns are near-empty the
# same way — STREETSUFFIX 12 rows, ADDRESSNUMBERPREFIX 17, ADDRESSNUMBERSUFFIX 372 — and
# all four are subsumed by the mapped FULLSTREETNAME / FULLADDRESSTEXT, so nothing is lost
# in display today.

# Change classes (field values verified against the latest snapshot): a
# modification touching only these fields is reported in its humanized section
# (place renames / status changes / boundary reassignments) instead of the
# generic Updated Addresses table.
[classes]
status = ["ADDRESSLIFECYCLESTATUS"]
boundary = ["COMMUNITY"]
# NAME is the occupant/landmark name on the point ('Tim Hortons', 'Stack
# Brewhouse', 'Main Street Lift Station'; sampled 2026-08-20) and changes alone
# when a business turns over (7 solo changes) - the hastings Landmark_Name shape.
place_name = ["NAME"]
