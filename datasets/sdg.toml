slug = "sdg"
provider = "United Counties of Stormont, Dundas and Glengarry"
data_url = "https://services5.arcgis.com/zEv9BLFdYq38maPG/ArcGIS/rest/services/CivicAddress_Public/FeatureServer/0"
access = "arcgis"
format = "geojson"
# Licence found 2026-08-20, and it is RESTRICTIVE: item licenseInfo (item
# 423683e2b447410e88c84e0e1b8ed3be) says "No part of the information herein may be sold,
# copied, distributed, or transmitted in any form without the prior written consent of the
# County. All rights reserved. Copyright 2025 by the United Counties of Stormont, Dundas and
# Glengarry." Publishing diff reports of this data is NOT cleared - operator decision needed
# (ask the counties, or stop publishing sdg's reports). See TODO.md §3.
license_name = "Proprietary - all rights reserved (item licenseInfo)"
osm_compatible = "red-review"
# Operator decision 2026-08-20: keep tracking, publish nothing. The landing page shows the
# city as tracked with a "licence not compatible" badge and no report link; report pages are
# removed at render time. Flip back to true if the counties grant permission.
publish_reports = false

[identity]
# Region-wide layer: all six SDG townships (North/South Dundas, Glengarry, Stormont).
# The catalogue's separate "North Glengarry" entry is a subset of this layer.
# Unique_ID = municipality prefix + SDGCivicID (e.g. SS_30001). NOT populated on all but
# 1 row, as this said until 2026-10-23: where SDGCivicID is null/0 (~1,860 rows at the
# 06-11 baseline, ~2,010 on the 10-23 pull) it is the bare prefix (ND_, NG_, NS_, SD_, SG_,
# SS_), and 7 full ids are duplicated (SG_54093 x6, ND_12280 x4, ...). 13 keys stand for
# 1,863+ distinct addresses; the importer keeps one of each, so the rest are never stored.
# Switch to a pure synth key (key_field = "") approved 2026-10-23 but NOT applied: the
# history rebuild cannot bracket 06-12..06-23 (no raw pull; the hidden set changes across
# the gap). Do not flip key_field without migrating the store (recanonicalize.py notes).
key_field = "Unique_ID"
synth_fields = ["number", "street", "unit"]    # fallback for rows with a null Unique_ID

[fields]                                        # source property -> canonical name
number = "Address_Nu"
street = "Street_Nam"                           # StrNamAlia/Unit_Type/Settlement tracked via the props blob
unit   = "UnitNum"
full   = "LabelFull"
# LabelFullMod is the field health.py --drift saw the source add on 2026-08-08. Checked
# 2026-08-10: an EMPTY SCHEMA SLOT — 0 of 33,630 rows live, never present in props across
# all 30 snapshots. Not ignored (cf. oakville's SUITE): the name says it is a modified
# LabelFull, so a backfill would be a competing full-address string rather than noise —
# worth seeing, and worth revisiting which of the two `full` should map to if it fills.

# Change classes (field values verified against the latest snapshot): a
# modification touching only these fields is reported in its humanized section
# (place renames / status changes / boundary reassignments) instead of the
# generic Updated Addresses table.
[classes]
boundary = ["Municipali", "Settlement"]
