slug = "milton"
provider = "Town of Milton"
data_url = "https://api.milton.ca/arcgis/rest/services/WebMaps/MGIS/MapServer/63"
access = "arcgis"
format = "geojson"
# Licence found 2026-08-20: "Open Government Licence - Milton" (OGL-Canada-style grant) covers
# "all material on the Discover Milton Open Data webpage". Caveat: the open-data Address Points
# item points at api.milton.ca Datasets/Address_Pts, while we track api.milton.ca
# WebMaps/MGIS/MapServer/63 - same host and publisher, but the tracked URL is not literally the
# open-data item. https://discover-milton.hub.arcgis.com "Disclaimer and Terms of Use".
license_name = "Open Government Licence - Milton"
osm_compatible = "yellow-ogl"

ignore_fields = [
  # Abbreviated display composite of the mapped FULL_ADDRESS ('162 DIXON DRIVE' ->
  # DISPLAY_NAME '162 DIXON DR'; sampled 2026-08-20): restyle-prone echo, rode on
  # the 2026-07-16 unit edits and changed alone once (guelph ADDLEG precedent).
  "DISPLAY_NAME",
  # Map-label rotation angle - cartographic rendering metadata, rides on edits.
  "LABEL_ANGLE",
  # Staff initials of whoever assigned the address ('Mike T', 'MIKET', 'MTimbers',
  # 'FROM FDM ADDRES') - operational notes, not address data (renfrew Comment
  # precedent).
  "ASSIGNED_BY",
  # Property roll RSN - assessment join key, rekeys upstream (one solo rewrite
  # 2026-07-18; burlington PROPERTYRSN precedent). Kept in props as the tax link.
  "PROP_RSN",
]
keep_fields = ["PROP_RSN"]

[identity]
key_field = "Address_ID"                       # persistent address id, 100% populated, has gaps (max 49246 > rowcount; OBJECTID is sequential)
synth_fields = ["number", "street", "unit"]    # fallback only

[fields]                                        # source property -> canonical name
number = "ADDRESS_NUM"
street = "STREET_NAME"                          # GEOSTNAME/STREET_TYPE/ST_DIR_SUFFIX components tracked via the props blob
unit   = "UNIT_NUMBER"
full   = "FULL_ADDRESS"

# Change classes (field values verified against the latest snapshot): a
# modification touching only these fields is reported in its humanized section
# (place renames / status changes / boundary reassignments) instead of the
# generic Updated Addresses table.
[classes]
status = ["STATUS"]
boundary = ["WARD"]
