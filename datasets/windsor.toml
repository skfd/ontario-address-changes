slug = "windsor"
provider = "City of Windsor"
# The catalogued layer (.../MapServer/1, AllUniqueAddresses) is empty; the populated layer is 0
# (AllUniqueAddresses_Parcels, 133k rows). Parcel polygons -> normalize uses ring centroids (cf. renfrew).
data_url = "https://mappmycity.ca/arcgis/rest/services/MappMyCity/AllUniqueAddresses_Parcels/MapServer/0"
access = "arcgis"
format = "geojson"
license_name = "City of Windsor Terms of Use"
osm_compatible = "red-review"

# Source props whose changes are noise. All five were found by data-integrity's
# `health.py --drift` on 2026-08-08 and are empty at the source - 0 of 133,331 rows
# populated - so ignoring them suppresses nothing today. It is pre-emptive: an all-null
# prop never reaches props, but on the day the city backfills one, every row's
# payload_hash changes and the whole city opens a fresh SCD-2 range. Report-time noise
# could be fixed after the fact by regenerating; that store churn could not.
ignore_fields = [
  # Duplicates of the geometry. Windsor synthesizes identity from the address plus the
  # rounded centroid, so a real relocation already reports as retired + added rather than
  # as a modification - which means a populated X/Y could only ever manufacture updates
  # no real move underlies, never mask one.
  "X", "Y",
  # Artefacts of the spatial join this layer is built from (addresses onto parcels):
  # Join_Count is how many features matched, TARGET_FID and JOIN_FID are row indices of
  # the two join inputs. Row sequence numbers reassigned on every republish, exactly like
  # OBJECTID - not identity, and not address data. Deliberately not keep_fields: they
  # index a join we do not have the other side of, so nothing downstream can use them.
  "JOIN_FID", "Join_Count", "TARGET_FID",
]

[identity]
# gisid/propertyrsn/RollNumber are parcel ids that repeat across multi-address parcels (not per-row
# unique), so synthesize from the address.
key_field = ""                                 # synthesize from address + rounded centroid lon/lat
synth_fields = ["number", "street", "unit"]

[fields]                                        # source property -> canonical name
number = "street_address"
street = "street_name"                          # street_suffix/street_direction/Ward tracked via the props blob
unit   = "unit_number"
full   = "Address"

# Change classes (field values verified against the latest snapshot): a
# modification touching only these fields is reported in its humanized section
# (place renames / status changes / boundary reassignments) instead of the
# generic Updated Addresses table.
[classes]
boundary = ["Ward"]
