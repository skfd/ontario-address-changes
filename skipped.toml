# Sources probed during the rollout but NOT added, with the reason. Only sources with nothing
# pullable belong here: a live layer is tracked whatever its licence (publish_reports = false
# when the licence forbids publishing) - since 2026-10-16.
# Rendered as a "probed but not added" section on the landing page (docs/index.html)
# so coverage gaps are reviewable alongside the working datasets.
#
# status is a short badge; keep to the existing set where possible:
#   "Dead endpoint", "Empty / secured", "Proprietary licence",
#   "No address layer", "Untrusted copy", "Unstable URL", "Not found",
#   "Recovered - pending review"  (live verified layer found on a re-probe;
#                                  awaiting licence check + onboarding)

[[skipped]]
name = "City of Belleville"
status = "Dead endpoint"
detail = "gis.city.belleville.on.ca services root is empty (and its TLS cert is broken). Re-probed 2026-08-20 and 2026-10-30: the city's AGOL org (BellevilleGIS, 71 public services, hub 70 datasets) has no address layer - its Parcels carry ROLL/ParcelID only - and Hastings County's CivicAddresses excludes the separated city (no MUNICIPALI code for Belleville)."

[[skipped]]
name = "Northumberland County"
status = "No address layer"
detail = "Re-probed 2026-08-20 and 2026-10-30: the server is back (moved /arcgis to /server, 46 services) and the AGOL org has 199 more, but no address points anywhere - the only civic-address layer is 421 road polylines from 2019, and Parcel_Fabric_2025 (6,437 polygons with STREET_NUM/STREET_NAM) is one lower tier's fabric, a weak fallback at best. Cobourg (tracked, gated) covers part of the county."

[[skipped]]
name = "Essex County"
status = "No address layer"
detail = "Re-probed 2026-10-30: still no county-wide points (hub 120 datasets, cwserver OpenData 5 services). The county AGOL org does hold a Kingsville layer, MESH_WFL1/FeatureServer/0 'KingAddress_Sep25' (10,270 points, CIVIC/HOUSE_NO/STREET, owner rpalmini_kingsville, last edited 2025-10-28, no licence) - a dated snapshot inside a staff working map, tracked as kingsville from 2026-10-30, gated. Amherstburg, Tecumseh, Leamington and Kingsville are tracked; LaSalle, Lakeshore, Essex and Pelee have nothing."

[[skipped]]
name = "Owen Sound"
status = "No address layer"
detail = "Re-probed 2026-10-30: the city org (48 services) still has no address points; Parcels (8,072 polygons, 2024-02) carries address1-3 as a weak fallback. Grey County's tracked parcel-label layer already holds ~6,770 Owen Sound rows (city spelt five ways), so the city is covered from the county side."

[[skipped]]
name = "Kenora"
status = "No address layer"
detail = "Re-probed 2026-08-20 and 2026-10-30: city AGOL org is live (13 public services - zoning, roads, ownership, trails) but publishes no address or parcel-address layer."

[[skipped]]
name = "City of Brockville"
status = "Empty / secured"
detail = "Found by the ontario-osm-data-sources sweep (8,796 civic address points, last updated 2017). Probed 2026-10-16 and 2026-10-30: the PSDCitywide services, the PublicOnly folder and the layer count all answer 499 Token Required, and the city AGOL org (37 services) has roads only. The tracked United Counties of Leeds and Grenville layer carries 8,737 City of Brockville points (MUN = 'CITY OF BROCKVILLE', edited 2026-10-06, OGL), so the city is already covered from the county side."
